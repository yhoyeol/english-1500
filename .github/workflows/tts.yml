name: Generate TTS Audio

# 모든 push에 트리거 (paths 필터 제거 - 디버깅용)
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install --quiet edge-tts pydub

      - name: List audio.json files (debug)
        run: |
          ls -la *_audio.json 2>&1 || echo "no audio.json"
          echo "---"
          for f in *_audio.json; do echo "=== $f ==="; cat "$f"; done 2>&1

      - name: Generate audio mp3 files
        run: python3 scripts/generate_tts.py

      - name: Show generated files (debug)
        run: |
          echo "=== audio/ 구조 ==="
          find audio/ -type f 2>&1 | head -50

      - name: Commit & push audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/
          git status
          if git diff --cached --quiet; then
            echo "No new audio to commit."
          else
            git commit -m "🔊 Auto-generate TTS audio [skip ci]"
            git push
          fi
