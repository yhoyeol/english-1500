<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 1/300 · 2026-04-25 · Core Sentences</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --card2:#232732; --text:#e6e8ee; --muted:#8a93a6; --accent:#6ea8fe; --accent2:#ffb86b; --tag:#2d3142; --en:#aee0ff; --ko:#ffd6a8; --border:#2c3140; --ok:#5fd07c; --warn:#ffb86b; --err:#ff7a7a; }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif; line-height:1.5; max-width:820px; margin-left:auto; margin-right:auto; }
  header { margin-bottom:24px; }
  h1 { font-size:22px; margin:0 0 6px 0; }
  .sub { color:var(--muted); font-size:14px; }
  #wakeBtn { display:none; width:100%; background:var(--accent2); color:#0b1220; border:0; border-radius:10px; padding:14px; font-weight:700; font-size:15px; cursor:pointer; margin-bottom:14px; }
  #wakeBtn.show { display:block; }
  #controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:var(--card); padding:14px; border-radius:12px; border:1px solid var(--border); margin-bottom:18px; position:sticky; top:8px; z-index:10; }
  button { background:var(--accent); color:#0b1220; border:0; border-radius:8px; padding:10px 14px; font-weight:600; font-size:14px; cursor:pointer; }
  button.secondary { background:var(--card2); color:var(--text); border:1px solid var(--border); }
  button:disabled { opacity:0.5; cursor:not-allowed; }
  select { background:var(--card2); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:14px; max-width:200px; }
  label { color:var(--muted); font-size:13px; display:flex; align-items:center; gap:6px; }
  #voiceStatus { margin-left:auto; font-size:12px; color:var(--muted); }
  #voiceStatus.ok { color:var(--ok); }
  #voiceStatus.warn { color:var(--warn); }
  #voiceStatus.err { color:var(--err); }
  .voice-row { display:flex; gap:8px; flex-wrap:wrap; flex-basis:100%; padding-top:6px; border-top:1px dashed var(--border); margin-top:4px; }
  #debugInfo { font-size:11px; color:var(--muted); margin-top:6px; flex-basis:100%; word-break:break-all; }
  #modeBadge { font-size:11px; padding:3px 8px; border-radius:6px; margin-left:6px; }
  #modeBadge.mp3 { background:rgba(95,208,124,0.15); color:var(--ok); border:1px solid rgba(95,208,124,0.3); }
  #modeBadge.tts { background:rgba(255,184,107,0.15); color:var(--warn); border:1px solid rgba(255,184,107,0.3); }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:14px; transition:outline 0.15s ease; }
  .card.active { outline:2px solid var(--accent); }
  .card-head { display:flex; align-items:center; gap:8px; margin-bottom:6px; flex-wrap:wrap; }
  .num { font-weight:700; color:var(--accent2); }
  .tag { background:var(--tag); color:var(--muted); padding:3px 8px; border-radius:6px; font-size:12px; }
  .en { font-size:18px; font-weight:600; color:var(--en); margin:4px 0; }
  .ko { font-size:15px; color:var(--ko); margin:0 0 10px 0; }
  .play-one { background:var(--card2); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:6px 10px; font-size:13px; cursor:pointer; }
  .play-one.playing { background:var(--accent); color:#0b1220; border-color:var(--accent); }
  .progress { height:4px; background:var(--card2); border-radius:2px; margin-top:10px; overflow:hidden; flex-basis:100%; }
  .progress > .bar { height:100%; width:0%; background:var(--accent); transition:width 0.2s ease; }
  footer { margin-top:24px; padding-top:14px; border-top:1px solid var(--border); color:var(--muted); font-size:12px; text-align:center; }
  .hint { background:rgba(110,168,254,0.08); border:1px solid rgba(110,168,254,0.25); padding:10px 12px; border-radius:8px; font-size:13px; color:var(--muted); margin-bottom:14px; }
  .hint strong { color: var(--text); }
</style>
</head>
<body>
<header>
  <h1>🌅 Day 1/300 · 2026-04-25 (토) <span id="modeBadge"></span></h1>
  <div class="sub">기본 일상 + 상황별 회화 · 일상 인사 & 가벼운 반응 · 5문장</div>
</header>

<div class="hint" id="ttsHint" style="display:none;">
  💡 <strong>iOS</strong>: 한국어 음성 'Yuna' 또는 'Sora(프리미엄)' 권장. 설정 → 손쉬운 사용 → 음성 콘텐츠 → 음성 → 한국어에서 다운로드.
</div>

<button id="wakeBtn">🔓 음성 시스템 활성화 (한 번만 누르세요)</button>

<div id="controls">
  <button id="playAll" disabled>▶ 전체 재생</button>
  <button id="pause" class="secondary">⏸ 일시정지</button>
  <button id="stop" class="secondary">■ 정지</button>
  <label>속도 <select id="rate"><option value="0.8">0.8×</option><option value="0.9">0.9×</option><option value="1.0" selected>1.0×</option><option value="1.1">1.1×</option><option value="1.25">1.25×</option></select></label>
  <label>반복(쌍) <select id="repeats"><option>3</option><option selected>5</option><option>7</option></select></label>
  <span id="voiceStatus">음성 시스템 확인 중…</span>
  <div class="voice-row" id="voiceRow">
    <label>영어 음성 <select id="enVoice"><option value="">자동 선택</option></select></label>
    <label>한국어 음성 <select id="koVoice"><option value="">자동 선택</option></select></label>
  </div>
  <div id="debugInfo"></div>
  <div class="progress"><div id="globalBar" class="bar"></div></div>
</div>

<div id="sentences"></div>

<footer>누적 5/1500 (0.3%) · 관용구 60% · D-299</footer>

<script>
const SENTENCES = [
  {tag: "[상황별 + 관용구]", en: "I'm just hanging in there.", ko: "그럭저럭 지내고 있어."},
  {tag: "[기본 일상]",       en: "Sounds good to me.",        ko: "나는 좋아, 그렇게 하자."},
  {tag: "[상황별 + 구동사]", en: "Let me get back to you on that.", ko: "그건 좀 이따 답 줄게."},
  {tag: "[기본 일상]",       en: "I'm running a bit late.",   ko: "나 조금 늦을 것 같아."},
  {tag: "[상황별 + 관용구]", en: "It slipped my mind.",       ko: "깜빡했어."},
];

const FILE_DATE = (() => {
  const m = location.pathname.match(/(\d{4}-\d{2}-\d{2})_player\.html/);
  return m ? m[1] : null;
})();

const STORAGE_EN = "english1500_voice_en";
const STORAGE_KO = "english1500_voice_ko";

let mode = "checking"; // "mp3" | "tts" | "checking"
let mp3Players = [];   // 5 HTMLAudioElement
let currentAudio = null;
let playing = false, currentCardIdx = -1;

// Web Speech state
const synth = window.speechSynthesis;
let voices = [], voiceEN = null, voiceKO = null;
let queue = [], qIdx = 0, voicesReady = false;
let pollTimer = null;

const wakeBtn = document.getElementById("wakeBtn");
const playAllBtn = document.getElementById("playAll");
const statusEl = document.getElementById("voiceStatus");
const debugEl = document.getElementById("debugInfo");
const modeBadge = document.getElementById("modeBadge");
const ttsHint = document.getElementById("ttsHint");
const voiceRow = document.getElementById("voiceRow");

function setStatus(text, level) { statusEl.textContent = text; statusEl.classList.remove("ok","warn","err"); if (level) statusEl.classList.add(level); }
function setActiveCard(idx) { currentCardIdx = idx; document.querySelectorAll(".card").forEach((el, i) => { el.classList.toggle("active", i === idx); const btn = el.querySelector(".play-one"); if (btn) btn.classList.toggle("playing", i === idx); }); }
function updateProgress(pct) { document.getElementById("globalBar").style.width = pct + "%"; }
const sleep = ms => new Promise(r => setTimeout(r, ms));

// =========================================================
// MP3 모드 (GitHub Actions가 생성한 고품질 음성)
// =========================================================
async function checkMp3Mode() {
  if (!FILE_DATE) return false;
  try {
    const r = await fetch(`audio/${FILE_DATE}/01.mp3`, {method: "HEAD", cache: "no-store"});
    if (!r.ok) return false;
    return true;
  } catch (e) { return false; }
}

function setupMp3Mode() {
  mode = "mp3";
  mp3Players = SENTENCES.map((_, i) => {
    const idx = String(i + 1).padStart(2, "0");
    const a = new Audio(`audio/${FILE_DATE}/${idx}.mp3`);
    a.preload = "metadata";
    return a;
  });
  modeBadge.className = "mp3";
  modeBadge.textContent = "🎧 고품질 음성";
  setStatus("Edge Neural TTS (Aria · SunHi)", "ok");
  voiceRow.style.display = "none";
  wakeBtn.classList.remove("show");
  ttsHint.style.display = "none";
  playAllBtn.disabled = false;
  debugEl.textContent = `진단: MP3 모드 활성 · audio/${FILE_DATE}/`;
}

async function playAllMp3() {
  playing = true;
  for (let i = 0; i < mp3Players.length; i++) {
    if (!playing) break;
    setActiveCard(i);
    currentAudio = mp3Players[i];
    currentAudio.playbackRate = parseFloat(document.getElementById("rate").value);
    currentAudio.currentTime = 0;
    await new Promise((res) => {
      currentAudio.onended = () => res();
      currentAudio.onerror = () => res();
      const p = currentAudio.play();
      if (p && p.catch) p.catch(() => res());
    });
    updateProgress(((i + 1) / mp3Players.length) * 100);
    if (i < mp3Players.length - 1 && playing) await sleep(700);
  }
  setActiveCard(-1);
  playing = false;
}

function playOneMp3(i) {
  if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
  playing = true;
  setActiveCard(i);
  currentAudio = mp3Players[i];
  currentAudio.playbackRate = parseFloat(document.getElementById("rate").value);
  currentAudio.currentTime = 0;
  currentAudio.onended = () => { setActiveCard(-1); playing = false; };
  currentAudio.onerror = () => { setActiveCard(-1); playing = false; };
  const p = currentAudio.play();
  if (p && p.catch) p.catch(() => { setActiveCard(-1); playing = false; });
}

function pauseMp3() {
  if (!currentAudio) return;
  if (!currentAudio.paused) { currentAudio.pause(); document.getElementById("pause").textContent = "▶ 재개"; }
  else { currentAudio.play(); document.getElementById("pause").textContent = "⏸ 일시정지"; }
}

function stopMp3() {
  playing = false;
  if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
  setActiveCard(-1);
  updateProgress(0);
}

// =========================================================
// Web Speech (TTS) 모드 - mp3 없을 때 폴백
// =========================================================
function setupTtsMode() {
  mode = "tts";
  modeBadge.className = "tts";
  modeBadge.textContent = "📱 OS 음성 (폴백)";
  ttsHint.style.display = "block";
  voiceRow.style.display = "flex";
  setStatus("음성 로딩 중…");
  startTtsLoad();
}

function setDebugTts() {
  const enCount = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith("en")).length;
  const koCount = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith("ko")).length;
  debugEl.textContent = `진단: TTS 폴백 모드 · 전체 ${voices.length}개 · 영어 ${enCount}개 · 한국어 ${koCount}개`;
}

function autoPick(lang, prefer) {
  const cands = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith(lang.toLowerCase()));
  if (!cands.length) return null;
  for (const p of prefer) { const m = cands.find(v => v.name.toLowerCase().includes(p.toLowerCase())); if (m) return m; }
  const ms = cands.find(v => v.name.toLowerCase().includes("microsoft")); if (ms) return ms;
  const g = cands.find(v => v.name.toLowerCase().includes("google")); if (g) return g;
  return cands[0];
}

function populateVoiceSelect(selectId, langPrefix, storageKey) {
  const sel = document.getElementById(selectId); const cur = sel.value;
  sel.innerHTML = '<option value="">자동 선택</option>';
  const cands = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith(langPrefix.toLowerCase())).sort((a,b) => a.name.localeCompare(b.name));
  cands.forEach(v => { const opt = document.createElement("option"); opt.value = v.name; opt.textContent = `${v.name} (${v.lang})`; sel.appendChild(opt); });
  const saved = localStorage.getItem(storageKey);
  if (saved && cands.find(v => v.name === saved)) sel.value = saved;
  else if (cur) sel.value = cur;
}

function updateActiveVoices() {
  const enName = document.getElementById("enVoice").value;
  const koName = document.getElementById("koVoice").value;
  voiceEN = enName ? voices.find(v => v.name === enName) : autoPick("en", ["aria","jenny","samantha","natural","neural"]);
  voiceKO = koName ? voices.find(v => v.name === koName) : autoPick("ko", ["yuna","sora","sunhi","heami(natural)","natural","neural","heami"]);
  if (voiceEN && voiceKO) setStatus(`EN: ${voiceEN.name.split(" - ")[0]} · KO: ${voiceKO.name.split(" - ")[0]}`, "ok");
  else if (voiceEN && !voiceKO) setStatus(`⚠ 한국어 음성 없음. 영어만 가능. (EN: ${voiceEN.name})`, "warn");
  else if (!voiceEN && voiceKO) setStatus(`⚠ 영어 음성 없음. (KO: ${voiceKO.name})`, "warn");
  else setStatus("음성을 찾을 수 없음", "err");
}

function tryLoadVoices() {
  voices = synth.getVoices();
  setDebugTts();
  if (voices.length === 0) return false;
  voicesReady = true;
  populateVoiceSelect("enVoice", "en", STORAGE_EN);
  populateVoiceSelect("koVoice", "ko", STORAGE_KO);
  updateActiveVoices();
  playAllBtn.disabled = false;
  wakeBtn.classList.remove("show");
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  return true;
}

function startTtsLoad() {
  if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = tryLoadVoices;
  if (!tryLoadVoices()) {
    let polls = 0;
    pollTimer = setInterval(() => {
      polls++;
      if (tryLoadVoices() || polls > 30) {
        clearInterval(pollTimer); pollTimer = null;
        if (!voicesReady) { setStatus("음성 로딩 대기 중. 아래 노란 버튼을 누르세요.", "warn"); wakeBtn.classList.add("show"); }
      }
    }, 100);
  }
}

wakeBtn.addEventListener("click", () => {
  setStatus("활성화 중…", "warn");
  try { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; u.rate = 10; synth.speak(u); } catch(e) {}
  let polls = 0;
  const t = setInterval(() => { polls++; if (tryLoadVoices() || polls > 30) { clearInterval(t); if (!voicesReady) setStatus("음성 활성화 실패. iOS 설정에서 한국어 음성 다운로드 후 새로고침해주세요.", "err"); } }, 100);
});
