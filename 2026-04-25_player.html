<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 1/300 · 2026-04-25 · Core Sentences</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --card2: #232732;
    --text: #e6e8ee;
    --muted: #8a93a6;
    --accent: #6ea8fe;
    --accent2: #ffb86b;
    --tag: #2d3142;
    --en: #aee0ff;
    --ko: #ffd6a8;
    --border: #2c3140;
    --ok: #5fd07c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.5;
    max-width: 820px; margin-left: auto; margin-right: auto;
  }
  header { margin-bottom: 24px; }
  h1 { font-size: 22px; margin: 0 0 6px 0; }
  .sub { color: var(--muted); font-size: 14px; }

  #controls {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    background: var(--card); padding: 14px; border-radius: 12px;
    border: 1px solid var(--border); margin-bottom: 18px;
    position: sticky; top: 8px; z-index: 10;
  }
  button {
    background: var(--accent); color: #0b1220;
    border: 0; border-radius: 8px; padding: 10px 14px;
    font-weight: 600; font-size: 14px; cursor: pointer;
  }
  button.secondary { background: var(--card2); color: var(--text); border: 1px solid var(--border); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  select {
    background: var(--card2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 14px;
  }
  label { color: var(--muted); font-size: 13px; }

  #voiceStatus {
    margin-left: auto; font-size: 12px; color: var(--muted);
  }
  #voiceStatus.ok { color: var(--ok); }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; margin-bottom: 14px;
    transition: outline 0.15s ease;
  }
  .card.active { outline: 2px solid var(--accent); }
  .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .num { font-weight: 700; color: var(--accent2); }
  .tag {
    background: var(--tag); color: var(--muted);
    padding: 3px 8px; border-radius: 6px; font-size: 12px;
  }
  .en { font-size: 18px; font-weight: 600; color: var(--en); margin: 4px 0; }
  .ko { font-size: 15px; color: var(--ko); margin: 0 0 10px 0; }
  .play-one {
    background: var(--card2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 10px; font-size: 13px; cursor: pointer;
  }
  .play-one.playing { background: var(--accent); color: #0b1220; border-color: var(--accent); }

  .progress {
    height: 4px; background: var(--card2); border-radius: 2px; margin-top: 10px;
    overflow: hidden;
  }
  .progress > .bar {
    height: 100%; width: 0%; background: var(--accent);
    transition: width 0.2s ease;
  }
  footer {
    margin-top: 24px; padding-top: 14px; border-top: 1px solid var(--border);
    color: var(--muted); font-size: 12px; text-align: center;
  }
  .hint {
    background: rgba(110, 168, 254, 0.08);
    border: 1px solid rgba(110, 168, 254, 0.25);
    padding: 10px 12px; border-radius: 8px;
    font-size: 13px; color: var(--muted); margin-bottom: 14px;
  }
</style>
</head>
<body>
<header>
  <h1>🌅 Day 1/300 · 2026-04-25 (토)</h1>
  <div class="sub">기본 일상 + 상황별 회화 · 일상 인사 & 가벼운 반응 · 5문장</div>
</header>

<div class="hint">
  💡 이 페이지는 OS 내장 음성(Windows: Aria/SunHi Neural)을 사용합니다. 처음 재생할 때 한 번만 빈 화면을 클릭하면 모든 브라우저에서 동작합니다.
</div>

<div id="controls">
  <button id="playAll">▶ 전체 재생</button>
  <button id="pause" class="secondary">⏸ 일시정지</button>
  <button id="stop" class="secondary">■ 정지</button>
  <label>속도
    <select id="rate">
      <option value="0.8">0.8×</option>
      <option value="0.9" selected>0.9×</option>
      <option value="1.0">1.0×</option>
      <option value="1.1">1.1×</option>
    </select>
  </label>
  <label>반복(쌍)
    <select id="repeats">
      <option>3</option>
      <option selected>5</option>
      <option>7</option>
    </select>
  </label>
  <span id="voiceStatus">음성 로딩 중…</span>
</div>

<div id="sentences"></div>

<footer>
  누적 5/1500 (0.3%) · 관용구 60% · D-299
</footer>

<script>
const SENTENCES = [
  {tag: "[상황별 + 관용구]", en: "I'm just hanging in there.", ko: "그럭저럭 지내고 있어."},
  {tag: "[기본 일상]",       en: "Sounds good to me.",        ko: "나는 좋아, 그렇게 하자."},
  {tag: "[상황별 + 구동사]", en: "Let me get back to you on that.", ko: "그건 좀 이따 답 줄게."},
  {tag: "[기본 일상]",       en: "I'm running a bit late.",   ko: "나 조금 늦을 것 같아."},
  {tag: "[상황별 + 관용구]", en: "It slipped my mind.",       ko: "깜빡했어."},
];

const synth = window.speechSynthesis;
let voices = [];
let voiceEN = null, voiceKO = null;
let queue = [];
let qIdx = 0;
let playing = false;
let currentCardIdx = -1;

function pickVoice(lang, prefer) {
  // prefer: array of substrings to prefer (in priority order)
  const cands = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith(lang.toLowerCase()));
  if (!cands.length) return null;
  for (const p of prefer) {
    const m = cands.find(v => v.name.toLowerCase().includes(p.toLowerCase()));
    if (m) return m;
  }
  // Prefer Microsoft / Google over default
  const ms = cands.find(v => v.name.toLowerCase().includes("microsoft"));
  if (ms) return ms;
  const g = cands.find(v => v.name.toLowerCase().includes("google"));
  if (g) return g;
  return cands[0];
}

function loadVoices() {
  voices = synth.getVoices();
  voiceEN = pickVoice("en-US", ["aria", "jenny", "natural", "neural"]);
  voiceKO = pickVoice("ko-KR", ["sunhi", "heami", "natural", "neural"]);
  const status = document.getElementById("voiceStatus");
  if (voiceEN && voiceKO) {
    status.textContent = `EN: ${voiceEN.name.split(" - ")[0]} · KO: ${voiceKO.name.split(" - ")[0]}`;
    status.classList.add("ok");
  } else if (voiceEN || voiceKO) {
    status.textContent = `일부 음성만 로드됨 (EN:${!!voiceEN}, KO:${!!voiceKO})`;
  } else {
    status.textContent = "음성을 찾을 수 없음";
  }
}
synth.onvoiceschanged = loadVoices;
loadVoices();

function speakOne(text, voice, lang, rate) {
  return new Promise((resolve) => {
    const u = new SpeechSynthesisUtterance(text);
    if (voice) u.voice = voice;
    u.lang = lang;
    u.rate = rate;
    u.pitch = 1.0;
    u.onend = () => resolve();
    u.onerror = () => resolve();
    synth.speak(u);
  });
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function buildQueueForSentence(idx, repeats) {
  const s = SENTENCES[idx];
  const ops = [];
  for (let r = 0; r < repeats; r++) {
    ops.push({type: "speak", text: s.en, voice: voiceEN, lang: "en-US"});
    ops.push({type: "wait", ms: 280});
    ops.push({type: "speak", text: s.ko, voice: voiceKO, lang: "ko-KR"});
    if (r < repeats - 1) ops.push({type: "wait", ms: 550});
  }
  return ops;
}

async function runQueue() {
  playing = true;
  while (qIdx < queue.length && playing) {
    const op = queue[qIdx];
    if (op.cardIdx !== undefined && op.cardIdx !== currentCardIdx) {
      setActiveCard(op.cardIdx);
    }
    if (op.type === "speak") {
      const rate = parseFloat(document.getElementById("rate").value);
      await speakOne(op.text, op.voice, op.lang, rate);
    } else if (op.type === "wait") {
      await sleep(op.ms);
    }
    qIdx++;
    updateProgress();
    if (!playing) break;
  }
  if (qIdx >= queue.length) {
    playing = false;
    setActiveCard(-1);
    updateProgress(true);
  }
}

function setActiveCard(idx) {
  currentCardIdx = idx;
  document.querySelectorAll(".card").forEach((el, i) => {
    el.classList.toggle("active", i === idx);
    const btn = el.querySelector(".play-one");
    if (btn) btn.classList.toggle("playing", i === idx);
  });
}

function updateProgress(done) {
  const bar = document.getElementById("globalBar");
  if (!bar) return;
  const pct = done ? 100 : (queue.length === 0 ? 0 : (qIdx / queue.length) * 100);
  bar.style.width = pct + "%";
}

function render() {
  const root = document.getElementById("sentences");
  root.innerHTML = "";
  SENTENCES.forEach((s, i) => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <div class="card-head">
        <span class="num">${i+1}.</span>
        <span class="tag">${s.tag}</span>
      </div>
      <div class="en">"${s.en}"</div>
      <div class="ko">${s.ko}</div>
      <button class="play-one" data-i="${i}">▶ 이 문장만 5쌍</button>
    `;
    root.appendChild(div);
  });
  // Global progress
  const cont = document.getElementById("controls");
  const prog = document.createElement("div");
  prog.className = "progress";
  prog.style.flexBasis = "100%";
  prog.innerHTML = `<div id="globalBar" class="bar"></div>`;
  cont.appendChild(prog);

  document.querySelectorAll(".play-one").forEach(btn => {
    btn.addEventListener("click", () => {
      const i = parseInt(btn.dataset.i, 10);
      const repeats = parseInt(document.getElementById("repeats").value, 10);
      synth.cancel();
      queue = buildQueueForSentence(i, repeats).map(op => ({...op, cardIdx: i}));
      qIdx = 0;
      setActiveCard(i);
      runQueue();
    });
  });
}

document.getElementById("playAll").addEventListener("click", () => {
  const repeats = parseInt(document.getElementById("repeats").value, 10);
  synth.cancel();
  queue = [];
  for (let i = 0; i < SENTENCES.length; i++) {
    const ops = buildQueueForSentence(i, repeats).map(op => ({...op, cardIdx: i}));
    queue.push(...ops);
    if (i < SENTENCES.length - 1) queue.push({type: "wait", ms: 1300, cardIdx: i});
  }
  qIdx = 0;
  runQueue();
});

document.getElementById("pause").addEventListener("click", () => {
  if (synth.speaking && !synth.paused) {
    synth.pause();
    document.getElementById("pause").textContent = "▶ 재개";
  } else if (synth.paused) {
    synth.resume();
    document.getElementById("pause").textContent = "⏸ 일시정지";
  }
});

document.getElementById("stop").addEventListener("click", () => {
  playing = false;
  synth.cancel();
  qIdx = queue.length;
  setActiveCard(-1);
  updateProgress(false);
});

render();

// Workaround: some browsers need a user-initiated speak to enable voice list
document.body.addEventListener("click", () => {
  if (voices.length === 0) {
    const u = new SpeechSynthesisUtterance("");
    synth.speak(u);
    setTimeout(loadVoices, 200);
  }
}, {once: true});
</script>
</body>
</html>
