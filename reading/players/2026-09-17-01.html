<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>원서 발췌 · 2026-09-17</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --card2:#232732; --text:#e6e8ee; --muted:#8a93a6; --accent:#6ea8fe; --accent2:#ffb86b; --border:#2c3140; }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif; line-height:1.5; max-width:820px; margin-left:auto; margin-right:auto; }
  header { margin-bottom:20px; }
  h1 { font-size:22px; margin:0 0 6px 0; }
  .sub { color:var(--muted); font-size:14px; }
  #controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:var(--card); padding:14px; border-radius:12px; border:1px solid var(--border); margin-bottom:18px; position:sticky; top:8px; z-index:10; }
  button { background:var(--accent); color:#0b1220; border:0; border-radius:8px; padding:10px 14px; font-weight:600; font-size:14px; cursor:pointer; }
  button.secondary { background:var(--card2); color:var(--text); border:1px solid var(--border); }
  select { background:var(--card2); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:14px; }
  label { color:var(--muted); font-size:13px; display:flex; align-items:center; gap:6px; }
  #status { margin-left:auto; font-size:12px; color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:14px; }
  .card.active { outline:2px solid var(--accent); }
  .card-head { display:flex; align-items:center; gap:8px; margin-bottom:6px; flex-wrap:wrap; }
  .num { font-weight:700; color:var(--accent2); }
  .en { font-size:18px; font-weight:600; color:#aee0ff; margin:4px 0; }
  .ko { font-size:15px; color:#ffd6a8; margin:0 0 10px 0; }
  .play-one { background:var(--card2); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:6px 10px; font-size:13px; cursor:pointer; }
  .play-one.playing { background:var(--accent); color:#0b1220; border-color:var(--accent); }
  details { margin-top:6px; }
  summary { color:var(--muted); font-size:13px; cursor:pointer; }
  footer { margin-top:24px; padding-top:14px; border-top:1px solid var(--border); color:var(--muted); font-size:12px; text-align:center; }
</style>
</head>
<body>
<header>
  <h1>원서 발췌</h1>
  <div class="sub">2026-09-17 · 6문장</div>
</header>
<div id="controls">
  <button id="playAll">▶ 전체 재생</button>
  <button id="playAllSlow" class="secondary">🐢 전체 저속</button>
  <button id="stop" class="secondary">정지</button>
  <label>반복 <select id="repeatSel"><option value="1">1회</option><option value="2" selected>2회</option><option value="3">3회</option></select></label>
  <span id="status">준비됨</span>
</div>
<div id="cards"></div>
<footer>English Reading · 2026-09-17-01</footer>
<audio id="player"></audio>
<script>
const ENTRY_ID = "2026-09-17-01";
const sentences = [{"n": 1, "en": "Soon Hitler would come out of nowhere and gobble up this beautiful little country in the blink of an eye, but at the time no one knew what hardships lay in store for them.", "ko": "머지않아 히틀러가 느닷없이 나타나 눈 깜짝할 사이에 이 아름다운 작은 나라를 집어삼키겠지만, 당시에는 그 누구도 자신들에게 어떤 고난이 기다리고 있는지 알지 못했다.", "note": "would: 과거 시점의 미래(서사적 용법) · lay in store for = ~을 기다리고 있다"}, {"n": 2, "en": "This may be the most important proposition revealed by history: \"At the time, no one knew what was coming.\"", "ko": "이것이야말로 역사가 알려주는 가장 중요한 명제일지도 모른다: \"그 당시에는, 누구도 무슨 일이 닥칠지 알지 못했다.\"", "note": "may be = 추측 · revealed by history는 앞 명사를 수식하는 과거분사구"}, {"n": 3, "en": "Listening to Janáček's music, Aomame imagined the carefree winds sweeping across the plains of Bohemia and thought about the vicissitudes of history.", "ko": "야나체크의 음악을 들으며 아오마메는 보헤미아 평원을 가로지르는 근심 없는 바람을 떠올렸고, 역사의 변천에 대해 생각했다.", "note": "문두 분사구문의 의미상 주어 = Aomame · imagined와 thought 병렬 구조"}, {"n": 4, "en": "In 1926 Japan's Taisho Emperor died, and the era name was changed to Showa.", "ko": "1926년 일본의 다이쇼 천황이 사망했고, 연호가 쇼와로 바뀌었다.", "note": "was changed to = 수동태(~로 바뀌다)"}, {"n": 5, "en": "It was the beginning of a terrible, dark time in this country, too.", "ko": "그것은 이 나라에도 끔찍하고 암울한 시대의 시작이었다.", "note": ""}, {"n": 6, "en": "The short interlude of modernism and democracy was ending, giving way to fascism.", "ko": "모더니즘과 민주주의의 짧은 막간은 끝나가고 있었고, 파시즘에 자리를 내주고 있었다.", "note": "was ending = 진행형으로 점진적 변화 강조 · giving way to = 부대상황 분사구문"}];
const audio = document.getElementById('player');
const statusEl = document.getElementById('status');
const cardsEl = document.getElementById('cards');
let queue = [];
let queueIndex = 0;
let stopped = false;

function audioPath(n, slow) {
  if (n === 'full') return `../audio/${ENTRY_ID}/full${slow ? '_slow' : ''}.mp3`;
  return `../audio/${ENTRY_ID}/${String(n).padStart(2,'0')}${slow ? '_slow' : ''}.mp3`;
}

function render() {
  cardsEl.innerHTML = sentences.map(s => `
    <div class="card" id="card-${s.n}">
      <div class="card-head">
        <span class="num">${s.n}.</span>
        <button class="play-one" onclick="playOne(${s.n}, false)">▶</button>
        <button class="play-one" onclick="playOne(${s.n}, true)">🐢</button>
        <button class="play-one" onclick="playRepeat(${s.n})">🔁</button>
      </div>
      <div class="en">${s.en}</div>
      <div class="ko">${s.ko}</div>
      ${s.note ? `<details><summary>문법 포인트</summary>${s.note}</details>` : ''}
    </div>
  `).join('');
}

function setActive(n) {
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  if (n) {
    const el = document.getElementById(`card-${n}`);
    if (el) { el.classList.add('active'); el.scrollIntoView({behavior:'smooth', block:'center'}); }
  }
}

function playFile(src, onend) {
  audio.src = src;
  audio.onerror = () => { statusEl.textContent = '⏳ 음성 생성 중 — 2~3분 후 새로고침'; };
  audio.onended = onend || null;
  audio.play().catch(()=>{});
}

function playOne(n, slow) {
  stopped = false;
  setActive(n);
  statusEl.textContent = `${n}번 재생 중${slow ? ' (저속)' : ''}`;
  playFile(audioPath(n, slow), () => { statusEl.textContent = '준비됨'; setActive(null); });
}

function playRepeat(n) {
  const times = parseInt(document.getElementById('repeatSel').value, 10);
  let count = 0;
  stopped = false;
  setActive(n);
  function step() {
    if (stopped || count >= times) { statusEl.textContent = '준비됨'; setActive(null); return; }
    count++;
    statusEl.textContent = `${n}번 반복 재생 (${count}/${times})`;
    playFile(audioPath(n, false), step);
  }
  step();
}

function playAll(slow) {
  stopped = false;
  queue = sentences.map(s => s.n);
  queueIndex = 0;
  statusEl.textContent = `전체 재생 중${slow ? ' (저속)' : ''}`;
  function step() {
    if (stopped || queueIndex >= queue.length) { statusEl.textContent = '준비됨'; setActive(null); return; }
    const n = queue[queueIndex];
    setActive(n);
    queueIndex++;
    playFile(audioPath(n, slow), step);
  }
  step();
}

document.getElementById('playAll').onclick = () => playAll(false);
document.getElementById('playAllSlow').onclick = () => playAll(true);
document.getElementById('stop').onclick = () => { stopped = true; audio.pause(); statusEl.textContent = '정지됨'; setActive(null); };

render();
</script>
</body>
</html>
