<style>

  .tag { background:var(--tag); color:var(--muted); padding:3px 8px; border-radius:6px; font-size:12px; }

  .ko { font-size:15px; color:var(--ko); margin:0 0 10px 0; }
  .play-one { background:var(--card2); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:6px 10px; font-size:13px; cursor:pointer; }
  .play-one.playing { background:var(--accent); color:#0b1220; border-color:var(--accent); }
  .progress { height:4px; background:var(--card2); border-radius:2px; margin-top:10px; overflow:hidden; flex-basis:100%; }
  .progress > .bar { height:100%; width:0%; background:var(--accent); transition:width 0.2s ease; }
  footer { margin-top:24px; padding-top:14px; border-top:1px solid var(--border); color:var(--muted); font-size:12px; text-align:center; }
  .hint { background:rgba(110,168,254,0.08); border:1px solid rgba(110,168,254,0.25); padding:10px 12px; border-radius:8px; font-size:13px; color:var(--muted); margin-bottom:14px; }
</style>
</head>
<body>

  {tag: "[Alice]", en: "[Alice] I need to stock up on groceries this weekend.", ko: "이번 주말에 식료품을 잔뜩 사둬야 해요."},

  {tag: "[Dana]", en: "[Dana] Sure. Do you have a loyalty card I can sign up for?", ko: "네. 가입할 수 있는 멤버십 카드 있으세요?"},
  {tag: "[Alice]", en: "[Alice] Yes, please. That sounds great.", ko: "네, 부탁드려요. 좋네요."}
];
const VOICE_COMBOS = [
  {id: "FF", label: "Aria 여 + SoonBok 여"}
];
const FILE_DATE = (location.pathname.match(/(\d{4}-\d{2}-\d{2})_player\.html/) || [])[1] || null;
const STORAGE_COMBO = "english1500_combo";
const STORAGE_EN = "english1500_voice_en", STORAGE_KO = "english1500_voice_ko";
let mode = "checking", currentCombo = null, mp3Players = [], currentAudio = null, playing = false, currentCardIdx = -1;
const synth = window.speechSynthesis;
let voices = [], voiceEN = null, voiceKO = null, queue = [], qIdx = 0, voicesReady = false, pollTimer = null;
const wakeBtn = document.getElementById("wakeBtn"), playAllBtn = document.getElementById("playAll");
const statusEl = document.getElementById("voiceStatus"), debugEl = document.getElementById("debugInfo");
const modeBadge = document.getElementById("modeBadge"), ttsHint = document.getElementById("ttsHint");
const voiceRow = document.getElementById("voiceRow"), comboRow = document.getElementById("comboRow");
function setStatus(t, lvl) { statusEl.textContent = t; statusEl.classList.remove("ok","warn","err"); if (lvl) statusEl.classList.add(lvl); }
function setActiveCard(idx) { currentCardIdx = idx; document.querySelectorAll(".card").forEach((el,i) => { el.classList.toggle("active", i===idx); const b = el.querySelector(".play-one"); if (b) b.classList.toggle("playing", i===idx); }); }
function updateProgress(pct) { document.getElementById("globalBar").style.width = pct + "%"; }
const sleep = ms => new Promise(r => setTimeout(r, ms));
function mp3Url(comboId, idx) { const i = String(idx+1).padStart(2,"0"); return "../audio/" + FILE_DATE + "/" + i + ".mp3"; }
async function checkMp3Mode() {
  if (!FILE_DATE) { debugEl.textContent = "진단: 날짜 추출 실패"; return false; }
  setStatus("mp3 파일 확인 중...");
  try {
    const ctrl = new AbortController(); const tid = setTimeout(() => ctrl.abort(), 5000);
    const r = await fetch(mp3Url("FF", 0), {method:"HEAD", cache:"no-store", signal: ctrl.signal});
    clearTimeout(tid);
    debugEl.textContent = "진단: mp3 HEAD = " + r.status;
    return r.ok;
  } catch(e) { debugEl.textContent = "진단: fetch 실패 (" + e.name + ": " + e.message + ")"; return false; }
}
function rebuildMp3Players() {
  if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
  mp3Players = SENTENCES.map((_,i) => { const a = new Audio(mp3Url(currentCombo, i)); a.preload = "metadata"; return a; });
}
function setupMp3Mode() {
  mode = "mp3";
  // combo 드롭다운 채우기
  const sel = document.getElementById("comboSel"); sel.innerHTML = "";
  VOICE_COMBOS.forEach(c => { const o = document.createElement("option"); o.value = c.id; o.textContent = c.label; sel.appendChild(o); });
  const saved = localStorage.getItem(STORAGE_COMBO);
  currentCombo = (saved && VOICE_COMBOS.find(c => c.id === saved)) ? saved : "FF";
  sel.value = currentCombo;
  sel.addEventListener("change", e => {
    currentCombo = e.target.value;
    localStorage.setItem(STORAGE_COMBO, currentCombo);
    rebuildMp3Players();
    const c = VOICE_COMBOS.find(x => x.id === currentCombo);
    setStatus("Edge Neural · " + (c ? c.label : currentCombo), "ok");
  });
  rebuildMp3Players();
  modeBadge.className = "mp3"; modeBadge.textContent = "고품질 음성";
  const c = VOICE_COMBOS.find(x => x.id === currentCombo);
  setStatus("Edge Neural · " + (c ? c.label : currentCombo), "ok");
  comboRow.style.display = "flex"; voiceRow.style.display = "none";
  wakeBtn.classList.remove("show"); ttsHint.style.display = "none";
  playAllBtn.disabled = false;
  debugEl.textContent = "진단: MP3 모드 · audio/" + FILE_DATE + "/" + currentCombo + "/";
}
async function playAllMp3() {
  playing = true;
  for (let i = 0; i < mp3Players.length; i++) {
    if (!playing) break;
    setActiveCard(i);
    currentAudio = mp3Players[i];
    currentAudio.playbackRate = parseFloat(document.getElementById("rate").value);
    currentAudio.currentTime = 0;
    await new Promise(res => { currentAudio.onended = () => res(); currentAudio.onerror = () => res(); const p = currentAudio.play(); if (p && p.catch) p.catch(() => res()); });
    updateProgress(((i+1)/mp3Players.length)*100);
    if (i < mp3Players.length-1 && playing) await sleep(700);
  }
  setActiveCard(-1); playing = false;
}
function playOneMp3(i) {
  if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
  playing = true; setActiveCard(i);
  currentAudio = mp3Players[i];
  currentAudio.playbackRate = parseFloat(document.getElementById("rate").value);
  currentAudio.currentTime = 0;
  currentAudio.onended = () => { setActiveCard(-1); playing = false; };
  currentAudio.onerror = () => { setActiveCard(-1); playing = false; };
  const p = currentAudio.play(); if (p && p.catch) p.catch(() => { setActiveCard(-1); playing = false; });
}
function pauseMp3() { if (!currentAudio) return; if (!currentAudio.paused) { currentAudio.pause(); document.getElementById("pause").textContent = "재개"; } else { currentAudio.play(); document.getElementById("pause").textContent = "일시정지"; } }
function stopMp3() { playing = false; if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; } setActiveCard(-1); updateProgress(0); }
function setupTtsMode() {
  mode = "tts"; modeBadge.className = "tts"; modeBadge.textContent = "OS 음성 (폴백)";
  ttsHint.style.display = "block"; voiceRow.style.display = "flex"; comboRow.style.display = "none";
  setStatus("음성 로딩 중..."); startTtsLoad();
}
function setDebugTts() {
  const en = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith("en")).length;
  const ko = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith("ko")).length;
  debugEl.textContent = "진단: TTS 폴백 · 전체 " + voices.length + "개 · 영어 " + en + "개 · 한국어 " + ko + "개";
}
function autoPick(lang, prefer) {
  const c = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith(lang.toLowerCase()));
  if (!c.length) return null;
  for (const p of prefer) { const m = c.find(v => v.name.toLowerCase().includes(p.toLowerCase())); if (m) return m; }
  return c.find(v => v.name.toLowerCase().includes("microsoft")) || c.find(v => v.name.toLowerCase().includes("google")) || c[0];
}
function populateVoiceSelect(id, langPrefix, key) {
  const sel = document.getElementById(id), cur = sel.value;
  sel.innerHTML = '<option value="">자동 선택</option>';
  const cands = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith(langPrefix.toLowerCase())).sort((a,b) => a.name.localeCompare(b.name));
  cands.forEach(v => { const o = document.createElement("option"); o.value = v.name; o.textContent = v.name + " (" + v.lang + ")"; sel.appendChild(o); });
  const saved = localStorage.getItem(key);
  if (saved && cands.find(v => v.name === saved)) sel.value = saved;
  else if (cur) sel.value = cur;
}
function updateActiveVoices() {
  const en = document.getElementById("enVoice").value, ko = document.getElementById("koVoice").value;
  voiceEN = en ? voices.find(v => v.name === en) : autoPick("en", ["aria","jenny","samantha","natural","neural"]);
  voiceKO = ko ? voices.find(v => v.name === ko) : autoPick("ko", ["yuna","sora","sunhi","heami(natural)","natural","neural","heami"]);
  if (voiceEN && voiceKO) setStatus("EN: " + voiceEN.name.split(" - ")[0] + " · KO: " + voiceKO.name.split(" - ")[0], "ok");
  else if (voiceEN) setStatus("한국어 없음. 영어만. (" + voiceEN.name + ")", "warn");
  else if (voiceKO) setStatus("영어 없음. (" + voiceKO.name + ")", "warn");
  else setStatus("음성 없음", "err");
}
function tryLoadVoices() {
  voices = synth.getVoices(); setDebugTts();
  if (!voices.length) return false;
  voicesReady = true;
  populateVoiceSelect("enVoice","en",STORAGE_EN); populateVoiceSelect("koVoice","ko",STORAGE_KO);
  updateActiveVoices(); playAllBtn.disabled = false; wakeBtn.classList.remove("show");
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  return true;
}
function startTtsLoad() {
  if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = tryLoadVoices;
  if (!tryLoadVoices()) {
    let polls = 0;
    pollTimer = setInterval(() => {
      polls++;
      if (tryLoadVoices() || polls > 30) {
        clearInterval(pollTimer); pollTimer = null;
        if (!voicesReady) { setStatus("음성 로딩 대기. 노란 버튼 누르세요.", "warn"); wakeBtn.classList.add("show"); }
      }
    }, 100);
  }
}
wakeBtn.addEventListener("click", () => {
  setStatus("활성화 중...", "warn");
  try { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; u.rate = 10; synth.speak(u); } catch(e) {}
  let polls = 0;
  const t = setInterval(() => {
    polls++;
    if (tryLoadVoices() || polls > 30) {
      clearInterval(t);
      if (!voicesReady) setStatus("활성화 실패. iOS에서 한국어 음성 다운로드.", "err");
    }
  }, 100);
});
function speakOne(text, voice, lang, rate) {
  return new Promise(res => { const u = new SpeechSynthesisUtterance(text); if (voice) u.voice = voice; u.lang = lang; u.rate = rate; u.pitch = 1.0; u.onend = () => res(); u.onerror = () => res(); synth.speak(u); });
}
function buildQueueForSentence(idx, repeats) {
  const s = SENTENCES[idx]; const ops = [];
  for (let r = 0; r < repeats; r++) {
    if (voiceEN) { ops.push({type:"speak", text:s.en, voice:voiceEN, lang:"en-US"}); ops.push({type:"wait", ms:280}); }
    if (voiceKO) ops.push({type:"speak", text:s.ko, voice:voiceKO, lang:"ko-KR"});
    if (r < repeats-1) ops.push({type:"wait", ms:550});
  }
  return ops;
}
async function runQueueTts() {
  playing = true;
  while (qIdx < queue.length && playing) {
    const op = queue[qIdx];
    if (op.cardIdx !== undefined && op.cardIdx !== currentCardIdx) setActiveCard(op.cardIdx);
    if (op.type === "speak") { const rate = parseFloat(document.getElementById("rate").value); await speakOne(op.text, op.voice, op.lang, rate); }
    else if (op.type === "wait") await sleep(op.ms);
    qIdx++; updateProgress((qIdx/queue.length)*100); if (!playing) break;
  }
  if (qIdx >= queue.length) { playing = false; setActiveCard(-1); updateProgress(100); }
}
playAllBtn.addEventListener("click", async () => {
  if (mode === "mp3") { stopMp3(); await playAllMp3(); return; }
  if (!voicesReady) { wakeBtn.click(); return; }
  const repeats = parseInt(document.getElementById("repeats").value, 10);
  synth.cancel(); queue = [];
  for (let i = 0; i < SENTENCES.length; i++) {
    const ops = buildQueueForSentence(i, repeats).map(op => Object.assign({}, op, {cardIdx:i}));
    queue.push(...ops);
    if (i < SENTENCES.length-1) queue.push({type:"wait", ms:1300, cardIdx:i});
  }
  qIdx = 0; runQueueTts();
});
document.getElementById("pause").addEventListener("click", () => {
  if (mode === "mp3") { pauseMp3(); return; }
  if (synth.speaking && !synth.paused) { synth.pause(); document.getElementById("pause").textContent = "재개"; }
  else if (synth.paused) { synth.resume(); document.getElementById("pause").textContent = "일시정지"; }
});
document.getElementById("stop").addEventListener("click", () => {
  if (mode === "mp3") { stopMp3(); return; }
  playing = false; synth.cancel(); qIdx = queue.length; setActiveCard(-1); updateProgress(0);
});
function render() {
  const root = document.getElementById("sentences"); root.innerHTML = "";
  SENTENCES.forEach((s,i) => {
    const div = document.createElement("div"); div.className = "card";
    div.innerHTML = '<div class="card-head"><span class="num">' + (i+1) + '.</span><span class="tag">' + s.tag + '</span></div><div class="en">"' + s.en + '"</div><div class="ko">' + s.ko + '</div><button class="play-one" data-i="' + i + '">이 문장만 5쌍</button>';
    root.appendChild(div);
  });
  document.querySelectorAll(".play-one").forEach(btn => {
    btn.addEventListener("click", () => {
      const i = parseInt(btn.dataset.i, 10);
      if (mode === "mp3") { playOneMp3(i); return; }
      if (!voicesReady) { wakeBtn.click(); return; }
      const repeats = parseInt(document.getElementById("repeats").value, 10);
      synth.cancel();
      queue = buildQueueForSentence(i, repeats).map(op => Object.assign({}, op, {cardIdx:i}));
      qIdx = 0; setActiveCard(i); runQueueTts();
    });
  });
}
document.getElementById("enVoice").addEventListener("change", e => { if (e.target.value) localStorage.setItem(STORAGE_EN, e.target.value); else localStorage.removeItem(STORAGE_EN); updateActiveVoices(); });
document.getElementById("koVoice").addEventListener("change", e => { if (e.target.value) localStorage.setItem(STORAGE_KO, e.target.value); else localStorage.removeItem(STORAGE_KO); updateActiveVoices(); });
render();
(async () => { const ok = await checkMp3Mode(); if (ok) setupMp3Mode(); else setupTtsMode(); })();
</script>
